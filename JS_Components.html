<script>
// ===================================
// COMPONENTES REUTILIZÁVEIS (UI)
// ===================================

const UIComponents = {
    
    // Empty State genérico
    emptyState: function(config) {
        const {
            icon = 'inbox',
            title = 'Nenhum dado encontrado',
            description = 'Não há informações para exibir no momento.',
            actionText = null,
            actionCallback = null,
            iconColor = 'text-slate-400'
        } = config;
        
        return `
            <div class="flex flex-col items-center justify-center p-12 text-center">
                <div class="mb-6 p-6 bg-slate-100 dark:bg-slate-800 rounded-full">
                    <i data-lucide="${icon}" class="w-16 h-16 ${iconColor}"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">${title}</h3>
                <p class="text-slate-600 dark:text-slate-400 max-w-md mb-6">${description}</p>
                ${actionText ? `
                    <button onclick="${actionCallback}" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-all hover:scale-105 active:scale-95 shadow-lg">
                        ${actionText}
                    </button>
                ` : ''}
            </div>
        `;
    },
    
    // Loading Spinner
    loadingSpinner: function(text = 'Carregando...') {
        return `
            <div class="flex flex-col items-center justify-center p-12">
                <div class="relative">
                    <div class="w-16 h-16 border-4 border-slate-200 dark:border-slate-700 rounded-full"></div>
                    <div class="w-16 h-16 border-4 border-blue-600 rounded-full animate-spin border-t-transparent absolute top-0 left-0"></div>
                </div>
                <p class="text-slate-600 dark:text-slate-400 mt-4 font-medium">${text}</p>
            </div>
        `;
    },
    
    // Card genérico
    card: function(config) {
        const {
            title,
            subtitle = null,
            content,
            footer = null,
            icon = null,
            iconColor = 'text-blue-600',
            className = ''
        } = config;
        
        return `
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 transition-all hover:shadow-lg ${className}">
                ${title ? `
                    <div class="p-6 border-b border-slate-100 dark:border-slate-700">
                        <div class="flex items-center gap-3">
                            ${icon ? `<i data-lucide="${icon}" class="w-5 h-5 ${iconColor}"></i>` : ''}
                            <div class="flex-1">
                                <h3 class="font-bold text-slate-800 dark:text-white">${title}</h3>
                                ${subtitle ? `<p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${subtitle}</p>` : ''}
                            </div>
                        </div>
                    </div>
                ` : ''}
                <div class="p-6">
                    ${content}
                </div>
                ${footer ? `
                    <div class="p-4 bg-slate-50 dark:bg-slate-700/50 border-t border-slate-100 dark:border-slate-700">
                        ${footer}
                    </div>
                ` : ''}
            </div>
        `;
    },
    
    // Badge de status
    badge: function(config) {
        const {
            text,
            type = 'default', // success, danger, warning, info, default
            icon = null,
            size = 'md' // sm, md, lg
        } = config;
        
        const colorClasses = {
            success: 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 border-green-300 dark:border-green-700',
            danger: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 border-red-300 dark:border-red-700',
            warning: 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300 border-yellow-300 dark:border-yellow-700',
            info: 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border-blue-300 dark:border-blue-700',
            default: 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-600'
        };
        
        const sizeClasses = {
            sm: 'px-2 py-0.5 text-xs',
            md: 'px-2.5 py-1 text-xs',
            lg: 'px-3 py-1.5 text-sm'
        };
        
        return `
            <span class="inline-flex items-center gap-1 rounded-full font-bold border ${colorClasses[type]} ${sizeClasses[size]}">
                ${icon ? `<i data-lucide="${icon}" class="w-3 h-3"></i>` : ''}
                ${text}
            </span>
        `;
    },
    
    // Alert box
    alert: function(config) {
        const {
            type = 'info', // success, danger, warning, info
            title,
            message,
            icon = null,
            dismissible = false
        } = config;
        
        const colorClasses = {
            success: 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-800 dark:text-green-300',
            danger: 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-800 dark:text-red-300',
            warning: 'bg-yellow-50 dark:bg-yellow-900/20 border-yellow-200 dark:border-yellow-800 text-yellow-800 dark:text-yellow-300',
            info: 'bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800 text-blue-800 dark:text-blue-300'
        };
        
        const icons = {
            success: 'check-circle',
            danger: 'alert-circle',
            warning: 'alert-triangle',
            info: 'info'
        };
        
        const alertIcon = icon || icons[type];
        
        return `
            <div class="border-l-4 p-4 rounded-r-lg ${colorClasses[type]} flex items-start gap-3">
                <i data-lucide="${alertIcon}" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <div class="flex-1">
                    ${title ? `<h4 class="font-bold mb-1">${title}</h4>` : ''}
                    <p class="text-sm">${message}</p>
                </div>
                ${dismissible ? `
                    <button onclick="this.closest('div').remove()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                ` : ''}
            </div>
        `;
    },
    
    // Skeleton loader
    skeleton: function(type = 'line', count = 3) {
        if (type === 'card') {
            return `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 space-y-4 animate-pulse">
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
                </div>
            `;
        }
        
        return Array(count).fill(0).map(() => `
            <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded animate-pulse mb-3"></div>
        `).join('');
    },
    
    // Tooltip
    tooltip: function(text, position = 'top') {
        return `data-tooltip="${text}" data-tooltip-position="${position}"`;
    }
};

// Exporta globalmente
if (typeof window !== 'undefined') {
    window.UIComponents = UIComponents;
}
</script>
