<script>
// ===================================
// COMPONENTE DE VISÃO POR BANCOS
// ===================================

let SELECTED_BANK = null;
let BANKS_VIEW_MODE = 'cards'; // 'cards' ou 'list'

// Renderiza seção de bancos
function renderBanksSection() {
    const banks = GLOBAL_DATA.banks || [];
    const transactions = GLOBAL_DATA.transactions || [];
    
    if (banks.length === 0) {
        return `
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center">
                <i data-lucide="landmark" class="w-16 h-16 mx-auto text-slate-300 dark:text-slate-600 mb-4"></i>
                <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-2">Nenhum banco cadastrado</h3>
                <p class="text-slate-500 dark:text-slate-400">Adicione bancos na aba BANCOS da planilha.</p>
                <p class="text-xs text-slate-400 mt-2">Colunas: ID, Nome, Tipo, Saldo, Icone</p>
            </div>
        `;
    }
    
    // Calcula dados de cada banco
    const banksData = banks.map(bank => {
        const bankTransactions = transactions.filter(t => 
            String(t.bankId) === String(bank.id) || t.bank === bank.name
        );
        
        // Transações no período filtrado
        const filteredTxs = bankTransactions.filter(t => {
            const tDate = parseDate(t.date);
            return tDate >= START_DATE && tDate <= END_DATE;
        });
        
        const entradas = filteredTxs.filter(t => t.type === 'Entrada').reduce((sum, t) => sum + t.value, 0);
        const saidas = filteredTxs.filter(t => t.type === 'Saída').reduce((sum, t) => sum + t.value, 0);
        
        // Últimas 5 transações
        const recentTxs = bankTransactions
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .slice(0, 5);
        
        // Pendentes neste banco
        const pendentes = bankTransactions.filter(t => 
            t.status === 'Pendente' || t.status === 'Agendado'
        );
        const totalPendente = pendentes.reduce((sum, t) => {
            return t.type === 'Entrada' ? sum + t.value : sum - t.value;
        }, 0);
        
        // Contas/Projetos que usam este banco
        const contasUsadas = [...new Set(filteredTxs.map(t => t.account))];
        
        return {
            ...bank,
            transactions: filteredTxs,
            recentTransactions: recentTxs,
            entradas,
            saidas,
            fluxo: entradas - saidas,
            pendentes: pendentes.length,
            totalPendente,
            saldoProjetado: bank.balance + totalPendente,
            contasUsadas
        };
    });
    
    // Total geral
    const totalBalance = banksData.reduce((sum, b) => sum + (b.balance || 0), 0);
    const totalEntradas = banksData.reduce((sum, b) => sum + b.entradas, 0);
    const totalSaidas = banksData.reduce((sum, b) => sum + b.saidas, 0);
    
    return `
        <!-- Header da Seção de Bancos -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 mb-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <i data-lucide="landmark" class="w-6 h-6 text-blue-500"></i>
                        Visão por Bancos
                    </h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                        ${banks.length} banco(s) • Período: ${formatDateBR(START_DATE)} a ${formatDateBR(END_DATE)}
                    </p>
                </div>
                
                <div class="flex items-center gap-2">
                    <!-- Toggle de visualização -->
                    <div class="flex bg-slate-100 dark:bg-slate-700 rounded-lg p-1">
                        <button onclick="setBanksViewMode('cards')" 
                                class="p-2 rounded-lg transition-all ${BANKS_VIEW_MODE === 'cards' ? 'bg-white dark:bg-slate-600 shadow' : 'hover:bg-white/50'}"
                                title="Visualização em Cards">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        </button>
                        <button onclick="setBanksViewMode('list')" 
                                class="p-2 rounded-lg transition-all ${BANKS_VIEW_MODE === 'list' ? 'bg-white dark:bg-slate-600 shadow' : 'hover:bg-white/50'}"
                                title="Visualização em Lista">
                            <i data-lucide="list" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Resumo Geral de Bancos -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-900/20 dark:to-teal-900/20 rounded-xl">
                <div class="text-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide">Saldo Total</p>
                    <p class="text-2xl font-bold text-slate-800 dark:text-white privacy-blur">${formatCurrency(totalBalance)}</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide">Entradas</p>
                    <p class="text-2xl font-bold text-green-600 privacy-blur">${formatCurrency(totalEntradas)}</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide">Saídas</p>
                    <p class="text-2xl font-bold text-red-600 privacy-blur">${formatCurrency(totalSaidas)}</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide">Fluxo Líquido</p>
                    <p class="text-2xl font-bold ${totalEntradas - totalSaidas >= 0 ? 'text-green-600' : 'text-red-600'} privacy-blur">
                        ${formatCurrency(totalEntradas - totalSaidas)}
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Cards/Lista de Bancos -->
        ${BANKS_VIEW_MODE === 'cards' ? renderBanksCards(banksData) : renderBanksList(banksData)}
        
        <!-- Modal de Detalhes -->
        <div id="bank-detail-modal"></div>
    `;
}

// Renderiza bancos em formato de cards
function renderBanksCards(banksData) {
    return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${banksData.map(bank => `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 hover:shadow-lg hover:border-emerald-300 dark:hover:border-emerald-600 transition-all cursor-pointer group"
                     onclick="openBankDetail('${bank.id}')" data-testid="bank-card-${bank.id}">
                    
                    <!-- Header do Card -->
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-2xl shadow-lg">
                                ${bank.icon || '🏦'}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white group-hover:text-emerald-600 transition-colors">
                                    ${bank.name}
                                </h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400">${bank.type || 'Banco'}</p>
                            </div>
                        </div>
                        <div class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                        </div>
                    </div>
                    
                    <!-- Saldo -->
                    <div class="mb-4">
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">Saldo Atual</p>
                        <p class="text-3xl font-bold ${bank.balance >= 0 ? 'text-slate-800 dark:text-white' : 'text-red-600'} privacy-blur">
                            ${formatCurrency(bank.balance || 0)}
                        </p>
                        ${bank.totalPendente !== 0 ? `
                            <p class="text-xs mt-1 ${bank.totalPendente >= 0 ? 'text-green-600' : 'text-orange-600'}">
                                Projetado: ${formatCurrency(bank.saldoProjetado)} 
                                <span class="text-slate-400">(${bank.pendentes} pendente${bank.pendentes !== 1 ? 's' : ''})</span>
                            </p>
                        ` : ''}
                    </div>
                    
                    <!-- Mini Gráfico de Fluxo -->
                    <div class="flex items-center gap-4 mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-1 text-green-600 mb-1">
                                <i data-lucide="arrow-down-left" class="w-3 h-3"></i>
                                <span class="text-xs">Entradas</span>
                            </div>
                            <p class="font-bold text-green-600 privacy-blur">${formatCurrencyCompact(bank.entradas)}</p>
                        </div>
                        <div class="w-px h-8 bg-slate-200 dark:bg-slate-700"></div>
                        <div class="flex-1">
                            <div class="flex items-center gap-1 text-red-600 mb-1">
                                <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
                                <span class="text-xs">Saídas</span>
                            </div>
                            <p class="font-bold text-red-600 privacy-blur">${formatCurrencyCompact(bank.saidas)}</p>
                        </div>
                    </div>
                    
                    <!-- Barra de Progresso Entradas vs Saídas -->
                    <div class="h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                        ${bank.entradas + bank.saidas > 0 ? `
                            <div class="h-full bg-gradient-to-r from-green-500 to-green-400 rounded-full" 
                                 style="width: ${(bank.entradas / (bank.entradas + bank.saidas) * 100)}%"></div>
                        ` : ''}
                    </div>
                    
                    <!-- Contas que usam este banco -->
                    ${bank.contasUsadas.length > 0 ? `
                        <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                            <p class="text-xs text-slate-500 dark:text-slate-400 mb-2">Contas/Projetos movimentados</p>
                            <div class="flex flex-wrap gap-1">
                                ${bank.contasUsadas.slice(0, 4).map(conta => `
                                    <span class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-600 dark:text-slate-300">
                                        ${conta}
                                    </span>
                                `).join('')}
                                ${bank.contasUsadas.length > 4 ? `
                                    <span class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-400">
                                        +${bank.contasUsadas.length - 4}
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('')}
        </div>
    `;
}

// Renderiza bancos em formato de lista
function renderBanksList(banksData) {
    return `
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700">
            <table class="w-full">
                <thead class="bg-slate-50 dark:bg-slate-700">
                    <tr>
                        <th class="text-left p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">Banco</th>
                        <th class="text-right p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">Saldo</th>
                        <th class="text-right p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase hidden md:table-cell">Entradas</th>
                        <th class="text-right p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase hidden md:table-cell">Saídas</th>
                        <th class="text-right p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">Fluxo</th>
                        <th class="text-center p-4 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                    ${banksData.map(bank => `
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors cursor-pointer"
                            onclick="openBankDetail('${bank.id}')">
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-xl">
                                        ${bank.icon || '🏦'}
                                    </div>
                                    <div>
                                        <p class="font-medium text-slate-800 dark:text-white">${bank.name}</p>
                                        <p class="text-xs text-slate-500">${bank.type || 'Banco'}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="p-4 text-right">
                                <p class="font-bold ${bank.balance >= 0 ? 'text-slate-800 dark:text-white' : 'text-red-600'} privacy-blur">
                                    ${formatCurrency(bank.balance || 0)}
                                </p>
                                ${bank.pendentes > 0 ? `
                                    <p class="text-xs text-slate-400">${bank.pendentes} pendente(s)</p>
                                ` : ''}
                            </td>
                            <td class="p-4 text-right hidden md:table-cell">
                                <p class="font-medium text-green-600 privacy-blur">${formatCurrency(bank.entradas)}</p>
                            </td>
                            <td class="p-4 text-right hidden md:table-cell">
                                <p class="font-medium text-red-600 privacy-blur">${formatCurrency(bank.saidas)}</p>
                            </td>
                            <td class="p-4 text-right">
                                <p class="font-bold ${bank.fluxo >= 0 ? 'text-green-600' : 'text-red-600'} privacy-blur">
                                    ${bank.fluxo >= 0 ? '+' : ''}${formatCurrency(bank.fluxo)}
                                </p>
                            </td>
                            <td class="p-4 text-center">
                                <button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-600 rounded-lg transition-colors"
                                        onclick="event.stopPropagation(); openBankDetail('${bank.id}')">
                                    <i data-lucide="eye" class="w-4 h-4 text-slate-400"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

// Abre modal de detalhe do banco
function openBankDetail(bankId) {
    const banks = GLOBAL_DATA.banks || [];
    const transactions = GLOBAL_DATA.transactions || [];
    const accounts = GLOBAL_DATA.accounts || [];
    
    const bank = banks.find(b => String(b.id) === String(bankId));
    if (!bank) return;
    
    // Filtra transações do banco
    const bankTransactions = transactions.filter(t => 
        String(t.bankId) === String(bankId) || t.bank === bank.name
    ).sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // Filtra pelo período
    const filteredTxs = bankTransactions.filter(t => {
        const tDate = parseDate(t.date);
        return tDate >= START_DATE && tDate <= END_DATE;
    });
    
    // Agrupa por conta/projeto
    const byAccount = {};
    filteredTxs.forEach(tx => {
        const acc = tx.account || 'Outros';
        if (!byAccount[acc]) {
            byAccount[acc] = { entradas: 0, saidas: 0, count: 0 };
        }
        if (tx.type === 'Entrada') {
            byAccount[acc].entradas += tx.value;
        } else {
            byAccount[acc].saidas += tx.value;
        }
        byAccount[acc].count++;
    });
    
    const totalEntradas = filteredTxs.filter(t => t.type === 'Entrada').reduce((sum, t) => sum + t.value, 0);
    const totalSaidas = filteredTxs.filter(t => t.type === 'Saída').reduce((sum, t) => sum + t.value, 0);
    
    const modalHtml = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto" onclick="closeBankDetail(event)">
            <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-4xl w-full my-8 overflow-hidden" onclick="event.stopPropagation()">
                
                <!-- Header -->
                <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-xl bg-white/20 flex items-center justify-center text-3xl">
                                ${bank.icon || '🏦'}
                            </div>
                            <div>
                                <h2 class="text-2xl font-bold">${bank.name}</h2>
                                <p class="text-emerald-100">${bank.type || 'Banco'}</p>
                            </div>
                        </div>
                        <button onclick="closeBankDetail()" class="p-2 hover:bg-white/20 rounded-lg transition-colors">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>
                    
                    <!-- Saldo e Resumo -->
                    <div class="grid grid-cols-3 gap-4 mt-6">
                        <div class="bg-white/10 rounded-xl p-4 text-center">
                            <p class="text-xs text-emerald-100 uppercase">Saldo Atual</p>
                            <p class="text-2xl font-bold privacy-blur">${formatCurrency(bank.balance || 0)}</p>
                        </div>
                        <div class="bg-white/10 rounded-xl p-4 text-center">
                            <p class="text-xs text-emerald-100 uppercase">Entradas (período)</p>
                            <p class="text-2xl font-bold text-green-300 privacy-blur">${formatCurrency(totalEntradas)}</p>
                        </div>
                        <div class="bg-white/10 rounded-xl p-4 text-center">
                            <p class="text-xs text-emerald-100 uppercase">Saídas (período)</p>
                            <p class="text-2xl font-bold text-red-300 privacy-blur">${formatCurrency(totalSaidas)}</p>
                        </div>
                    </div>
                </div>
                
                <!-- Conteúdo -->
                <div class="p-6 max-h-[60vh] overflow-y-auto">
                    
                    <!-- Abas -->
                    <div class="flex gap-2 mb-6 border-b border-slate-200 dark:border-slate-700">
                        <button onclick="switchBankTab('transactions')" id="bank-tab-transactions" 
                                class="px-4 py-2 font-medium text-emerald-600 border-b-2 border-emerald-600">
                            Extrato
                        </button>
                        <button onclick="switchBankTab('accounts')" id="bank-tab-accounts"
                                class="px-4 py-2 font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400">
                            Por Conta/Projeto
                        </button>
                    </div>
                    
                    <!-- Tab: Extrato -->
                    <div id="bank-content-transactions">
                        ${filteredTxs.length > 0 ? `
                            <div class="space-y-2">
                                ${filteredTxs.slice(0, 50).map(tx => `
                                    <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-lg flex items-center justify-center ${tx.type === 'Entrada' ? 'bg-green-100 dark:bg-green-900/30 text-green-600' : 'bg-red-100 dark:bg-red-900/30 text-red-600'}">
                                                <i data-lucide="${tx.type === 'Entrada' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-5 h-5"></i>
                                            </div>
                                            <div>
                                                <p class="font-medium text-slate-800 dark:text-white">${tx.description || tx.subcategory || tx.category}</p>
                                                <p class="text-xs text-slate-500">
                                                    ${formatDateBR(tx.date)} • 
                                                    <span class="text-blue-600">${tx.account}</span>
                                                    ${tx.subcategory ? ` • ${tx.subcategory}` : ''}
                                                </p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="font-bold ${tx.type === 'Entrada' ? 'text-green-600' : 'text-red-600'} privacy-blur">
                                                ${tx.type === 'Entrada' ? '+' : '-'}${formatCurrency(tx.value)}
                                            </p>
                                            <span class="text-xs px-2 py-0.5 rounded-full ${getStatusStyle(tx.status)}">${tx.status}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            ${filteredTxs.length > 50 ? `
                                <p class="text-center text-sm text-slate-500 mt-4">
                                    Mostrando 50 de ${filteredTxs.length} transações
                                </p>
                            ` : ''}
                        ` : `
                            <div class="text-center py-12">
                                <i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-600 mb-4"></i>
                                <p class="text-slate-500 dark:text-slate-400">Nenhuma transação no período selecionado</p>
                            </div>
                        `}
                    </div>
                    
                    <!-- Tab: Por Conta/Projeto -->
                    <div id="bank-content-accounts" class="hidden">
                        ${Object.keys(byAccount).length > 0 ? `
                            <div class="space-y-3">
                                ${Object.entries(byAccount)
                                    .sort((a, b) => (b[1].entradas + b[1].saidas) - (a[1].entradas + a[1].saidas))
                                    .map(([acc, data]) => `
                                    <div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-xl">
                                        <div class="flex items-center justify-between mb-2">
                                            <div>
                                                <p class="font-medium text-slate-800 dark:text-white">${acc}</p>
                                                <p class="text-xs text-slate-500">${data.count} transação(ões)</p>
                                            </div>
                                            <div class="text-right">
                                                ${data.entradas > 0 ? `<span class="text-green-600 privacy-blur">+${formatCurrencyCompact(data.entradas)}</span>` : ''}
                                                ${data.entradas > 0 && data.saidas > 0 ? ' / ' : ''}
                                                ${data.saidas > 0 ? `<span class="text-red-600 privacy-blur">-${formatCurrencyCompact(data.saidas)}</span>` : ''}
                                            </div>
                                        </div>
                                        <div class="h-2 bg-slate-200 dark:bg-slate-600 rounded-full overflow-hidden flex">
                                            ${data.entradas > 0 ? `
                                                <div class="h-full bg-green-500" style="width: ${data.entradas / (data.entradas + data.saidas) * 100}%"></div>
                                            ` : ''}
                                            ${data.saidas > 0 ? `
                                                <div class="h-full bg-red-500" style="width: ${data.saidas / (data.entradas + data.saidas) * 100}%"></div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="text-center py-12">
                                <p class="text-slate-500 dark:text-slate-400">Nenhuma conta no período</p>
                            </div>
                        `}
                    </div>
                    
                </div>
                
                <!-- Footer -->
                <div class="p-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-3">
                    <button onclick="closeBankDetail()" class="px-4 py-2 text-slate-600 hover:text-slate-800 transition-colors">
                        Fechar
                    </button>
                    <button onclick="filterByBank('${bankId}')" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors flex items-center gap-2">
                        <i data-lucide="filter" class="w-4 h-4"></i>
                        Filtrar Dashboard
                    </button>
                </div>
                
            </div>
        </div>
    `;
    
    document.getElementById('bank-detail-modal').innerHTML = modalHtml;
    lucide.createIcons();
}

// Fecha modal de detalhe do banco
function closeBankDetail(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('bank-detail-modal').innerHTML = '';
}

// Troca aba no modal do banco
function switchBankTab(tab) {
    document.getElementById('bank-tab-transactions').classList.remove('text-emerald-600', 'border-b-2', 'border-emerald-600');
    document.getElementById('bank-tab-transactions').classList.add('text-slate-500');
    document.getElementById('bank-tab-accounts').classList.remove('text-emerald-600', 'border-b-2', 'border-emerald-600');
    document.getElementById('bank-tab-accounts').classList.add('text-slate-500');
    
    document.getElementById('bank-content-transactions').classList.add('hidden');
    document.getElementById('bank-content-accounts').classList.add('hidden');
    
    document.getElementById('bank-tab-' + tab).classList.add('text-emerald-600', 'border-b-2', 'border-emerald-600');
    document.getElementById('bank-tab-' + tab).classList.remove('text-slate-500');
    document.getElementById('bank-content-' + tab).classList.remove('hidden');
}

// Muda modo de visualização
function setBanksViewMode(mode) {
    BANKS_VIEW_MODE = mode;
    renderApp();
}

// Filtra dashboard por banco
function filterByBank(bankId) {
    SELECTED_BANK = bankId;
    closeBankDetail();
    renderApp();
    showToast('Dashboard filtrado pelo banco selecionado', 'info', 3000);
}

// Limpa filtro de banco
function clearBankFilter() {
    SELECTED_BANK = null;
    renderApp();
}
</script>
