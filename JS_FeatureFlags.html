<script>
// ===================================
// GERENCIADOR DE FEATURES (FRONTEND)
// ===================================

let CURRENT_PLAN = null;
let PLAN_FEATURES = {};

// Inicializa sistema de features
function initFeatureFlags() {
    if (GLOBAL_DATA && GLOBAL_DATA.plan) {
        CURRENT_PLAN = GLOBAL_DATA.plan.plan;
        PLAN_FEATURES = GLOBAL_DATA.plan.features;
        
        console.log('[Features] Plano carregado:', GLOBAL_DATA.plan.name);
        console.log('[Features] Features disponíveis:', Object.keys(PLAN_FEATURES).filter(k => PLAN_FEATURES[k]));
    }
}

// Verifica se feature está disponível
function hasFeature(featureName) {
    if (!PLAN_FEATURES) return false;
    return PLAN_FEATURES[featureName] === true;
}

// Retorna informações do plano
function getPlanName() {
    return GLOBAL_DATA?.plan?.name || 'Básico';
}

// Renderiza badge do plano
function renderPlanBadge() {
    if (!GLOBAL_DATA?.plan) return '';
    
    const colors = {
        'basic': 'bg-slate-100 text-slate-700 border-slate-300',
        'intermediate': 'bg-blue-100 text-blue-700 border-blue-300',
        'advanced': 'bg-purple-100 text-purple-700 border-purple-300'
    };
    
    const plan = GLOBAL_DATA.plan;
    const colorClass = colors[plan.plan] || colors.basic;
    
    return `
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border ${colorClass} text-xs font-bold">
            <i data-lucide="star" class="w-3 h-3"></i>
            <span>${plan.name}</span>
        </div>
    `;
}

// Renderiza mensagem de upgrade
function renderUpgradePrompt(featureName) {
    const featureNames = {
        'dre': 'DRE Gerencial',
        'ai_classification': 'Classificação Automática com IA',
        'ai_insights': 'Insights Inteligentes com IA',
        'predictive_analytics': 'Análise Preditiva'
    };
    
    const name = featureNames[featureName] || 'este recurso';
    
    return `
        <div class="bg-gradient-to-r from-purple-50 to-blue-50 dark:from-purple-900/20 dark:to-blue-900/20 border-2 border-purple-200 dark:border-purple-700 rounded-2xl p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-purple-100 dark:bg-purple-900 rounded-full mb-4">
                <i data-lucide="lock" class="w-8 h-8 text-purple-600 dark:text-purple-400"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">
                ${name} Disponível em Planos Superiores
            </h3>
            <p class="text-slate-600 dark:text-slate-400 mb-6 max-w-md mx-auto">
                Faça upgrade para desbloquear este e outros recursos avançados
            </p>
            <div class="flex items-center justify-center gap-3">
                <button onclick="showUpgradeModal()" class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:scale-105 active:scale-95 transition-all shadow-lg">
                    <i data-lucide="zap" class="w-4 h-4 inline mr-2"></i>
                    Ver Planos
                </button>
                <button onclick="contactSupport()" class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-6 py-3 rounded-lg font-medium border-2 border-slate-200 dark:border-slate-700 hover:border-purple-300 dark:hover:border-purple-600 transition-colors">
                    Falar com Consultor
                </button>
            </div>
        </div>
    `;
}

// Modal de upgrade
function showUpgradeModal() {
    const modal = document.createElement('div');
    modal.className = 'fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    
    modal.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-auto" onclick="event.stopPropagation()">
            <!-- Header -->
            <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-6 text-white">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-2xl font-bold">Escolha Seu Plano</h2>
                    <button onclick="this.closest('.fixed').remove()" class="text-white/80 hover:text-white">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <p class="text-white/90">Desbloqueie recursos avançados e otimize sua gestão financeira</p>
            </div>
            
            <!-- Plans Grid -->
            <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                ${renderPlanCard('basic')}
                ${renderPlanCard('intermediate')}
                ${renderPlanCard('advanced')}
            </div>
            
            <!-- Footer -->
            <div class="bg-slate-50 dark:bg-slate-900 p-6 text-center border-t border-slate-200 dark:border-slate-700">
                <p class="text-sm text-slate-600 dark:text-slate-400">
                    Dúvidas? <a href="javascript:contactSupport()" class="text-purple-600 hover:underline font-medium">Fale com nossa equipe</a>
                </p>
            </div>
        </div>
    `;
    
    document.body.appendChild(modal);
    lucide.createIcons();
}

// Renderiza card de plano
function renderPlanCard(planType) {
    const plans = {
        basic: {
            name: 'Básico',
            price: 'R$ 97',
            period: '/mês',
            description: 'Ideal para começar',
            features: [
                { text: 'Dashboard completo', included: true },
                { text: 'Filtros avançados', included: true },
                { text: 'Exportação CSV/PDF', included: true },
                { text: 'Gráficos e métricas', included: true },
                { text: 'Insights básicos', included: true },
                { text: 'DRE Gerencial', included: false },
                { text: 'IA - Classificação', included: false },
                { text: 'IA - Insights', included: false }
            ],
            current: CURRENT_PLAN === 'basic',
            cta: 'Plano Atual',
            color: 'slate'
        },
        intermediate: {
            name: 'Intermediário',
            price: 'R$ 197',
            period: '/mês',
            description: 'Para gestão avançada',
            popular: true,
            features: [
                { text: 'Tudo do Básico', included: true, bold: true },
                { text: 'DRE Gerencial', included: true },
                { text: 'Relatórios personalizados', included: true },
                { text: 'Suporte prioritário', included: true },
                { text: 'IA - Classificação', included: false },
                { text: 'IA - Insights', included: false },
                { text: 'Análise preditiva', included: false }
            ],
            current: CURRENT_PLAN === 'intermediate',
            cta: CURRENT_PLAN === 'intermediate' ? 'Plano Atual' : 'Fazer Upgrade',
            color: 'blue'
        },
        advanced: {
            name: 'Avançado',
            price: 'R$ 397',
            period: '/mês',
            description: 'Máxima inteligência',
            features: [
                { text: 'Tudo do Intermediário', included: true, bold: true },
                { text: 'IA - Classificação automática', included: true },
                { text: 'IA - Insights inteligentes', included: true },
                { text: 'Análise preditiva (3 meses)', included: true },
                { text: 'Suporte VIP', included: true },
                { text: 'Consultoria mensal inclusa', included: true },
                { text: 'API para integrações', included: true }
            ],
            current: CURRENT_PLAN === 'advanced',
            cta: CURRENT_PLAN === 'advanced' ? 'Plano Atual' : 'Fazer Upgrade',
            color: 'purple'
        }
    };
    
    const plan = plans[planType];
    const isPopular = plan.popular;
    const isCurrent = plan.current;
    
    const borderColor = {
        slate: 'border-slate-200 dark:border-slate-700',
        blue: 'border-blue-300 dark:border-blue-600',
        purple: 'border-purple-300 dark:border-purple-600'
    }[plan.color];
    
    const buttonColor = isCurrent 
        ? 'bg-slate-400 cursor-not-allowed'
        : `bg-${plan.color}-600 hover:bg-${plan.color}-700`;
    
    return `
        <div class="relative border-2 ${borderColor} rounded-xl p-6 ${isCurrent ? 'ring-2 ring-' + plan.color + '-500' : ''}">
            ${isPopular ? `
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2">
                    <span class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-3 py-1 rounded-full text-xs font-bold">
                        ⭐ MAIS POPULAR
                    </span>
                </div>
            ` : ''}
            
            ${isCurrent ? `
                <div class="absolute -top-3 right-4">
                    <span class="bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold">
                        ✓ ATIVO
                    </span>
                </div>
            ` : ''}
            
            <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">${plan.name}</h3>
            <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">${plan.description}</p>
            
            <div class="mb-6">
                <span class="text-4xl font-bold text-slate-800 dark:text-white">${plan.price}</span>
                <span class="text-slate-500 dark:text-slate-400">${plan.period}</span>
            </div>
            
            <ul class="space-y-3 mb-6">
                ${plan.features.map(feature => `
                    <li class="flex items-start gap-2 text-sm">
                        <i data-lucide="${feature.included ? 'check-circle' : 'x-circle'}" 
                           class="w-5 h-5 shrink-0 ${feature.included ? 'text-green-500' : 'text-slate-300 dark:text-slate-600'}">
                        </i>
                        <span class="${feature.included ? 'text-slate-700 dark:text-slate-300' : 'text-slate-400 dark:text-slate-600'} ${feature.bold ? 'font-bold' : ''}">
                            ${feature.text}
                        </span>
                    </li>
                `).join('')}
            </ul>
            
            <button 
                onclick="${isCurrent ? '' : 'contactSupport(\'' + planType + '\')'}"
                class="w-full ${buttonColor} text-white py-3 rounded-lg font-bold transition-all ${isCurrent ? '' : 'hover:scale-105 active:scale-95 shadow-lg'}"
                ${isCurrent ? 'disabled' : ''}
            >
                ${plan.cta}
            </button>
        </div>
    `;
}

// Contato com suporte
function contactSupport(planType = null) {
    const message = planType 
        ? `Olá! Gostaria de fazer upgrade para o plano ${planType.toUpperCase()}.`
        : 'Olá! Gostaria de saber mais sobre os planos disponíveis.';
    
    const whatsappNumber = '5511999999999'; // Substituir pelo número real
    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
    
    window.open(url, '_blank');
}
</script>
